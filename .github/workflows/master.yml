name: Deploy to Virtuaal
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://minusadam.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install theme PHP dependencies
        working-directory: wp-content/themes/mehh
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wp-content/themes/mehh/package-lock.json
      - name: Install theme dependencies
        working-directory: wp-content/themes/mehh
        run: npm ci
      - name: Build theme assets
        working-directory: wp-content/themes/mehh
        run: npm run build
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy files to server
        run: |
          tar -czf - \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='node_modules' \
          --exclude='wp-content/uploads' \
          --exclude='wp-content/member-files' \
          . | ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          "mkdir -p '${{ secrets.DEPLOY_PATH }}' && tar -xzf - -C '${{ secrets.DEPLOY_PATH }}' --no-same-owner"
      # The tar upload above never removes anything on the server. This step deletes
      # the files that were deleted in git by this push (and directories left empty),
      # and leaves files git never tracked (uploads, server config, caches) alone.
      - name: Remove files deleted in git
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to compare with, nothing removed."
            exit 0
          fi
          if ! git fetch --quiet --depth=1 origin "$BEFORE"; then
            echo "::warning::Could not fetch $BEFORE, so files deleted in this push were not removed from the server."
            exit 0
          fi
          git diff --name-only --no-renames --diff-filter=D -z "$BEFORE" "$AFTER" > deleted-all.lst
          # Skip paths the upload excludes; the server manages those itself.
          grep -zvE '^(\.github|wp-content/uploads|wp-content/member-files)/|(^|/)node_modules/' deleted-all.lst > deleted.lst || true
          if [ ! -s deleted.lst ]; then
            echo "No files were deleted in git."
            exit 0
          fi
          echo "Removing $(tr -cd '\0' < deleted.lst | wc -c) files from the server:"
          tr '\0' '\n' < deleted.lst
          # Parent directories of the deleted files, deepest first. rmdir only removes empty ones.
          tr '\0' '\n' < deleted.lst | while IFS= read -r f; do
            d=$(dirname "$f")
            while [ "$d" != "." ]; do echo "$d"; d=$(dirname "$d"); done
          done | LC_ALL=C sort -ru | tr '\n' '\0' > dirs.lst
          ssh -p "$SSH_PORT" "$SSH_TARGET" "cd '$DEPLOY_PATH' && xargs -0 -r rm -f --" < deleted.lst
          ssh -p "$SSH_PORT" "$SSH_TARGET" "cd '$DEPLOY_PATH' && { xargs -0 -r rmdir -- 2>/dev/null; true; }" < dirs.lst
      # Cached pages keep pointing at the old theme assets until the cache is purged.
      # On multisite this empties the cache of every site in the network. The files are
      # already deployed at this point, so a failed purge only warns.
      - name: Purge LiteSpeed Cache
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if ! ssh -p "$SSH_PORT" "$SSH_TARGET" \
            "PATH=\"\$PATH:\$HOME/bin:/usr/local/bin\"; cd '$DEPLOY_PATH' && wp litespeed-purge all --url=https://minusadam.com/"; then
            echo "::warning::LiteSpeed Cache was not purged. Use Purge All in the WordPress admin bar."
          fi
