name: Deploy to Virtuaal
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://minusadam.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Dry run deploy to temp directory
        run: |
          tar -czf - \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='node_modules' \
          --exclude='wp-content/uploads' \
          --exclude='wp-content/member-files' \
          . | ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          "DRY_RUN_DIR='${{ secrets.DEPLOY_PATH }}-github-actions-dry-run' && rm -rf \"\$DRY_RUN_DIR\" && mkdir -p \"\$DRY_RUN_DIR\" && tar -xzf - -C \"\$DRY_RUN_DIR\" --no-same-owner && echo 'Dry run extracted to:' \"\$DRY_RUN_DIR\" && find \"\$DRY_RUN_DIR\" -maxdepth 2 | head -100"
