name: Deploy to Virtuaal
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://minusadam.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install theme PHP dependencies
        working-directory: wp-content/themes/mehh
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wp-content/themes/mehh/package-lock.json
      - name: Install theme dependencies
        working-directory: wp-content/themes/mehh
        run: npm ci
      - name: Build theme assets
        working-directory: wp-content/themes/mehh
        run: npm run build
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy files to server
        run: |
          tar -czf - \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='node_modules' \
          --exclude='wp-content/uploads' \
          --exclude='wp-content/member-files' \
          . | ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
          "mkdir -p '${{ secrets.DEPLOY_PATH }}' && tar -xzf - -C '${{ secrets.DEPLOY_PATH }}' --no-same-owner"
